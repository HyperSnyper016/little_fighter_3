<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Character select — nighttime rooftop arena concept</title>
  <desc>A game UI concept with pixel-art city silhouettes, cinematic rooftop lighting, a featured fighter, and roster panels.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#101c35"/>
      <stop offset=".58" stop-color="#182a43"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="horizon" x2="0" y2="1">
      <stop stop-color="#6084a0" stop-opacity=".04"/>
      <stop offset=".55" stop-color="#78a8c0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d89a64" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe2a0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f2bc74" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fighterLight">
      <stop stop-color="#f1bb78" stop-opacity=".38"/>
      <stop offset=".44" stop-color="#cc9566" stop-opacity=".12"/>
      <stop offset="1" stop-color="#cc9566" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#101b2c" stop-opacity=".96"/>
      <stop offset="1" stop-color="#08111f" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="activeCard" x2="0" y2="1">
      <stop stop-color="#513c34"/>
      <stop offset="1" stop-color="#282d36"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#293b4b"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="windowPattern" width="34" height="42" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="9" height="15" rx="1" fill="#9ab4c3" opacity=".17"/>
      <rect x="22" y="8" width="6" height="15" rx="1" fill="#e1ae78" opacity=".2"/>
      <rect x="7" y="30" width="9" height="5" rx="1" fill="#9ab4c3" opacity=".1"/>
    </pattern>
    <clipPath id="sceneClip">
      <rect width="1920" height="1080"/>
    </clipPath>
  </defs>
